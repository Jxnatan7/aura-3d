name: Deploy to Kubernetes Production

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubeconfig from secret
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_BASE64" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl --kubeconfig=$HOME/.kube/config get nodes

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          push: true
          tags: jxnatang7/aura-3d-api:latest

  deploy-k8s:
    needs: build-and-push
    runs-on: self-hosted
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME || 'admin' }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD || 'admin' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubeconfig from secret
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_BASE64" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl --kubeconfig=$HOME/.kube/config get nodes

      - name: Create Docker Registry Secret in K8s
        run: |
          kubectl delete secret regcred --ignore-not-found
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=$DOCKER_USERNAME \
            --docker-password=$DOCKER_PASSWORD \
            --docker-email=${DOCKER_EMAIL}

      - name: Deploy Manifests
        run: |
          cd k8s
          envsubst < mongo-config.yaml | kubectl apply -f -
          envsubst < api-config.yaml | kubectl apply -f -
          kubectl apply -f mongo-service.yaml
          kubectl apply -f mongo-statefulset.yaml
          kubectl apply -f api-service.yaml
          kubectl apply -f ingress.yaml
          kubectl apply -f api-deployment.yaml

      - name: Force Rollout Restart
        run: |
          kubectl rollout restart deployment/aura-3d-api
          kubectl rollout status deployment/aura-3d-api
