services:
  aura-3d-mongo:
    image: mongo:latest
    container_name: aura-3d-mongo
    hostname: aura-3d-mongo
    restart: unless-stopped
    environment:
      - "MONGO_INITDB_ROOT_USERNAME=admin"
      - "MONGO_INITDB_ROOT_PASSWORD=admin"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - ./data/mongo:/data/db
      - ./docker/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    ports:
      - "27017:27017"
    networks:
      - aura-3d-network

  aura-3d-redis:
    image: redis:alpine
    container_name: aura-3d-redis
    hostname: aura-3d-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - aura-3d-network

  minio:
    image: quay.io/minio/minio
    container_name: aura-3d-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
      - MINIO_SERVER_URL=https://aura-3d.app.br
    volumes:
      - ./data/minio:/data
    networks:
      - aura-3d-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    container_name: aura-3d-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 admin password123; do
        echo 'MinIO não está pronto... aguardando 1 segundo.';
        sleep 1;
      done;

      /usr/bin/mc mb --ignore-existing myminio/models-3d;

      /usr/bin/mc anonymous set download myminio/models-3d;

      echo 'Bucket criado e permissões configuradas com sucesso!';
      exit 0;
      "
    networks:
      - aura-3d-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aura-3d-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - aura-3d-network

networks:
  aura-3d-network:
    driver: bridge
